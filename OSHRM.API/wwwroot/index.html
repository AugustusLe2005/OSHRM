<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSHRM Enterprise - SPA System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .sidebar { min-height: 100vh; background-color: #1e293b; color: #fff; }
    .sidebar a { color: #94a3b8; text-decoration: none; padding: 12px 20px; display: block; border-radius: 8px; margin-bottom: 4px; font-weight: 500; cursor: pointer; }
    .sidebar a:hover, .sidebar a.active { background-color: #0f172a; color: #38bdf8; }
    .sidebar a i { width: 24px; }
  </style>
</head>
<body>
<div class="container-fluid p-0">
  <div class="row g-0">
    <!-- Sidebar Menu SPA Duy Nhất -->
    <div class="col-md-2 sidebar p-3 d-flex flex-column justify-content-between">
      <div>
        <div class="d-flex align-items-center mb-4 px-2">
          <i class="fa-solid fa-sitemap fs-3 text-info me-2"></i>
          <span class="fs-5 fw-bold text-white company-brand-text">OSHRM Enterprise</span>
        </div>
        <div class="nav flex-column" id="main-nav">
          <a href="#overview" data-page="overview" class="active"><i class="fa-solid fa-chart-pie"></i> Tổng quan</a>
          <a href="#organization" data-page="organization"><i class="fa-solid fa-diagram-project"></i> Cơ cấu Tổ chức</a>
          <a href="#department" data-page="department"><i class="fa-solid fa-sitemap"></i> Phòng ban & Chức vụ</a>
          <a href="#recruitment" data-page="recruitment"><i class="fa-solid fa-user-plus"></i> Tuyển dụng & Phễu</a>
          <a href="#benefits" data-page="benefits"><i class="fa-solid fa-gift"></i> Phúc lợi & Lương</a>
          <a href="#report" data-page="report"><i class="fa-solid fa-chart-line"></i> Báo cáo & KPI</a>
        </div>
      </div>
      <div class="p-2 border-top border-secondary border-opacity-25 text-muted small">
        <i class="fa-solid fa-shield-halved text-success me-1"></i> Luxious Team © 2026
      </div>
    </div>

    <!-- Main Dynamic Workspace -->
    <div class="col-md-10 p-4" id="app-workspace">
      <!-- Dynamic View Component Content -->
    </div>
  </div>
</div>

<!-- Modal Cấu Hình Doanh Nghiệp Toàn Cục -->
<div class="modal fade" id="companySettingsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title fw-bold"><i class="fa-solid fa-building me-2"></i>Cấu Hình Tên Doanh Nghiệp</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div class="mb-3">
          <label class="form-label fw-semibold">Tên Công Ty / Tập Đoàn Mới</label>
          <input type="text" id="companyNameInput" class="form-control" placeholder="Nhập tên công ty">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <button type="button" class="btn btn-primary" onclick="saveCompanyName()"><i class="fa-solid fa-floppy-disk me-1"></i>Lưu Thay Đổi</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const routes = {
    'overview': 'views/overview.html',
    'organization': 'views/organization.html',
    'department': 'views/department.html',
    'recruitment': 'views/recruitment.html',
    'benefits': 'views/benefits.html',
    'report': 'views/report.html'
  };

  async function loadView() {
    const hash = location.hash.replace('#', '') || 'overview';
    const viewUrl = routes[hash] || routes['overview'];

    document.querySelectorAll('#main-nav a').forEach(link => {
      if (link.getAttribute('data-page') === hash) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });

    try {
      const response = await fetch(viewUrl);
      if (!response.ok) throw new Error("Không thể nạp view " + viewUrl);
      const html = await response.text();
      document.getElementById('app-workspace').innerHTML = html;

      // Re-exec scripts trong view vừa load
      const scripts = document.getElementById('app-workspace').querySelectorAll("script");
      scripts.forEach(oldScript => {
        const newScript = document.createElement("script");
        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });

      applyCompanyName();
    } catch (error) {
      document.getElementById('app-workspace').innerHTML = `<div class="alert alert-danger p-4 rounded-3 shadow-sm"><i class="fa-solid fa-triangle-exclamation me-2"></i>Lỗi nạp module: ${error.message}</div>`;
    }
  }

  function applyCompanyName() {
    const savedName = localStorage.getItem("OSHRM_CompanyName") || "OSHRM Enterprise";
    document.querySelectorAll(".company-brand-text").forEach(el => el.innerText = savedName);
    const inputElem = document.getElementById("companyNameInput");
    if (inputElem) inputElem.value = savedName;
  }

  function saveCompanyName() {
    const newName = document.getElementById("companyNameInput").value.trim();
    if (newName) {
      localStorage.setItem("OSHRM_CompanyName", newName);
      applyCompanyName();
      const modalElem = document.getElementById('companySettingsModal');
      const modal = bootstrap.Modal.getInstance(modalElem);
      if (modal) modal.hide();
    }
  }

  window.addEventListener('hashchange', loadView);
  window.addEventListener('DOMContentLoaded', () => {
    applyCompanyName();
    loadView();
  });
</script>
</body>
</html>
