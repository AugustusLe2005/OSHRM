<div class="d-flex align-items-center justify-content-center" style="min-height: 75vh;">
  <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white" style="max-width: 450px; width: 100%;">
    <div class="text-center mb-4">
      <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
        <i class="fa-solid fa-shield-halved fs-2"></i>
      </div>
      <h4 class="fw-bold text-dark mb-1">Đăng Nhập OSHRM</h4>
      <p class="text-muted small">Hệ thống Quản trị Nhân sự Doanh nghiệp</p>
    </div>

    <form id="standaloneLoginForm" onsubmit="executeLogin(event)">
      <div class="mb-3">
        <label class="form-label fw-semibold small">Email Doanh Nghiệp</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
          <input type="email" id="loginEmailInput" class="form-control border-start-0 ps-0" value="nam.lh@luxious.vn" required placeholder="name@luxious.vn">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold small">Mật Khẩu</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
          <input type="password" id="loginPassInput" class="form-control border-start-0 ps-0" value="12345678" required placeholder="••••••••">
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="rememberCheck" checked>
          <label class="form-check-label small text-muted" for="rememberCheck">Ghi nhớ phiên</label>
        </div>
        <a href="javascript:void(0)" class="small text-decoration-none text-primary fw-semibold" onclick="showToast('Liên hệ Admin IT (IT-002) để khôi phục mật khẩu!', 'Quên Mật Khẩu', 'warning')">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm mb-3">
        <i class="fa-solid fa-right-to-bracket me-2"></i>Đăng Nhập Hệ Thống
      </button>

      <div class="text-center">
        <span class="text-muted small">Chưa có tài khoản nhân sự? </span>
        <a href="javascript:void(0)" class="small fw-bold text-primary text-decoration-none" onclick="showToast('Vui lòng liên hệ phòng HR để tạo hồ sơ nhân viên mới!', 'Đăng Ký', 'info')">Yêu cầu cấp tài khoản</a>
      </div>
    </form>
  </div>
</div>

<script>
  function executeLogin(e) {
    e.preventDefault();
    const email = document.getElementById("loginEmailInput").value.trim();
    
    // Lưu trạng thái đã đăng nhập
    localStorage.setItem("OSHRM_IsLoggedIn", "true");
    if (email) localStorage.setItem("OSHRM_UserEmail", email);
    
    if (typeof showToast === 'function') {
      showToast("Đăng nhập thành công! Đang chuyển hướng...", "Xin Chào", "success");
    }

    // Tự động chuyển hướng về trang Overview
    setTimeout(() => {
      window.location.hash = "#overview";
    }, 500);
  }
</script>
