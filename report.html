<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSHRM - Báo Cáo Thống Kê</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --sidebar-bg: #0f172a; --sidebar-hover: #1e293b; }
        body { background-color: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; }
        .sidebar { background-color: var(--sidebar-bg); min-height: 100vh; color: #fff; }
        .sidebar-brand { font-size: 1.2rem; font-weight: 700; color: #38bdf8; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 14px 20px; display: flex; align-items: center; gap: 10px; font-weight: 500; }
        .sidebar a:hover, .sidebar a.active { background-color: var(--sidebar-hover); color: #38bdf8; border-left: 4px solid #38bdf8; }
        .chart-card { border: none; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar d-flex flex-column justify-content-between p-0">
                <div>
                    <div class="sidebar-brand py-4 px-3 border-bottom border-secondary border-opacity-25 d-flex align-items-center gap-2">
                        <i class="fa-solid fa-building-user text-info"></i> OSHRM ENTERPRISE
                    </div>
                    <div class="mt-3">
                        <a href="index.html"><i class="fa-solid fa-users-gear"></i> Hồ Sơ Nhân Viên</a>
                        <a href="department.html"><i class="fa-solid fa-sitemap"></i> Cơ Cấu Doanh Nghiệp</a>
                        <a href="recruitment.html"><i class="fa-solid fa-user-plus"></i> Quản Lý Tuyển Dụng</a>
                        <a href="benefits.html"><i class="fa-solid fa-gift"></i> Chế Độ Đãi Ngộ</a>
                        <a href="report.html" class="active"><i class="fa-solid fa-chart-line"></i> Báo Cáo Thống Kê</a>
                    </div>
                </div>
                <div class="p-3 border-top border-secondary border-opacity-25 text-center text-muted small">
                    <i class="fa-solid fa-shield-halved text-success me-1"></i> OSHRM Corporate v2.4
                </div>
            </div>

            <!-- Workspace -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">Báo Cáo Thống Kê Nhân Sự</h3>
                        <p class="text-muted small mb-0">Phân tích tỉ lệ nhân sự theo phòng ban và cơ cấu trình độ chuyên môn</p>
                    </div>
                    <button class="btn btn-outline-primary shadow-sm fw-semibold" onclick="window.print()">
                        <i class="fa-solid fa-print me-1"></i> In Báo Cáo
                    </button>
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="card chart-card p-4 bg-white">
                            <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-chart-pie text-primary me-2"></i>Tỉ Lệ Nhân Sự Theo Phòng Ban</h5>
                            <canvas id="deptChart" style="max-height:300px;"></canvas>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card chart-card p-4 bg-white">
                            <h5 class="fw-bold text-dark mb-3"><i class="fa-solid fa-chart-column text-success me-2"></i>Cơ Cấu Trình Độ Chuyên Môn</h5>
                            <canvas id="degreeChart" style="max-height:300px;"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        new Chart(document.getElementById('deptChart'), {
            type: 'doughnut',
            data: {
                labels: ['Phòng IT', 'Phòng HR', 'Phòng Sales'],
                datasets: [{
                    data: [12, 6, 18],
                    backgroundColor: ['#0284c7', '#16a34a', '#0891b2']
                }]
            }
        });

        new Chart(document.getElementById('degreeChart'), {
            type: 'bar',
            data: {
                labels: ['Thạc sĩ', 'Kỹ sư CNTT', 'Cử nhân Quản trị', 'Cử nhân Kinh tế'],
                datasets: [{
                    label: 'Số lượng nhân viên',
                    data: [4, 12, 8, 12],
                    backgroundColor: '#3b82f6'
                }]
            },
            options: { scales: { y: { beginAtZero: true } } }
        });
    </script>
</body>
</html>
